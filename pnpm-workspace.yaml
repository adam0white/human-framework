packages:
  - packages/*
  - apps/*

# Keep exact published pins; link a local package only when its version matches.
linkWorkspacePackages: true
hoist: false
# Match the shared lab runtime; never download a runtime per repository.
engineStrict: true
strictPeerDependencies: true
# Resolve intentionally and fail on stale modules instead of mutating installs before scripts.
resolutionMode: highest
verifyDepsBeforeRun: error
dedupePeerDependents: true
minimumReleaseAge: 1440
# HF releases are consumed on the day we publish them. Keep the 24h delay for third parties.
minimumReleaseAgeExclude:
  - "@adam0white/*"
# Hardlinks share bytes across worktrees and make sharing measurable by inode.
packageImportMethod: hardlink
allowBuilds:
  esbuild@0.28.2: true
  workerd@1.20261019.1: true
  fsevents: false
overrides:
  vite: 8.3.5
  miniflare>undici: 7.30.1
  # Pin the registry origin so an equal-version workspace cannot replace the released core.
  "@adam0white/human-framework@4.15.0": "npmjs:@adam0white/human-framework@4.15.0"

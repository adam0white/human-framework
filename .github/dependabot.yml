version: 2

# Weekly, grouped, with a cooldown so a freshly published (possibly compromised) release is not proposed on day one.
# Note: package.json `allowScripts` pins esbuild and workerd by exact version; a bump of either needs its entry
# updated (`npm install-scripts approve <pkg>`), or npm skips its install script and warns.
# archive/ is provenance, not maintained (AGENTS.md): every entry excludes it (owner, 2026-10-20).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    exclude-paths: ["archive/**"]
    cooldown:
      default-days: 7
    groups:
      npm-dev:
        dependency-type: development
        update-types: [minor, patch]
      npm-prod:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    exclude-paths: ["archive/**"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The only pip manifests are under archive/; this entry exists to exclude them. Limit 0: no version-update PRs.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    exclude-paths: ["archive/**"]

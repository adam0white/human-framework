name: CI

# The same pieces as `npm run check` plus `npm run build`, run in parallel: one short job for lint, typecheck and
# build, and the test suite split across shards. The `ci` job at the end is the one stable check name to require
# in branch protection; it passes only when every other job passed, whatever the shard count.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runners stay on ubuntu-latest through its move to Ubuntu 26 (from 2026-10-19), deliberately unpinned: Node comes
# from setup-node (.nvmrc), nothing is compiled natively and no OS package is installed here.
jobs:
  static:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Vitest shards by a hash of the file path, not by duration, so shards are uneven. Measured 2026-10-05 on the
  # 2-CPU private-repo runner (one worker per shard): the suite is about 420 s of test work; four shards ran
  # 113/114/151/40 s. After the 2026-10-05 test reduction (shared simulation runs, mostly in the Game 2 tests: about 37 s of
  # CI work less) and with apps/site/src/watch/sim/gate.test.ts expected at ~40 % of its ~77 s, three shards
  # simulate at about 115/145/76 s: billed 8 job-minutes against 10 for four, for ~20 s more wall time. Each job pays
  # ~25 s of setup and rounds up to a minute. Adding or renaming test files moves the slice boundaries; re-check the
  # balance with --shard and the timing log when the slowest shard drifts past ~3 min. Vitest's default of one worker
  # per 2 CPUs is kept: two workers pushed a 30 s-budget village test past its timeout.
  test:
    name: test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Runner
        run: echo "$(nproc) CPUs, Node $(node --version)"
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  ci:
    name: ci
    if: always()
    needs: [static, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

name: CI

# The same pieces as `npm run check` plus `npm run build`, run in parallel: one short job for lint, typecheck and
# build, and the test suite split across shards. The `ci` job at the end is the one stable check name to require
# in branch protection; it passes only when every other job passed, whatever the shard count.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runners stay on ubuntu-latest through its move to Ubuntu 26 (from 2026-10-19), deliberately unpinned: Node comes
# from setup-node (.nvmrc), nothing is compiled natively and no OS package is installed here.
jobs:
  static:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # Vitest shards by a hash of the file path, not by duration, so shards are uneven. Measured 2026-10-05 on the
  # 2-CPU private-repo runner: 4 shards take 95-220 s against ~375-510 s for one job; the slowest shard is bound by
  # apps/site/src/watch/sim/gate.test.ts (~150 s of work in its describe body). Vitest's default of one worker per
  # 2 CPUs is kept: two workers pushed a 30 s-budget village test past its timeout.
  test:
    name: test (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Runner
        run: echo "$(nproc) CPUs, Node $(node --version)"
      - run: npx vitest run --shard=${{ matrix.shard }}/4

  ci:
    name: ci
    if: always()
    needs: [static, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

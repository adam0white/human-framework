name: CI

# The same pieces as `npm run check` plus `npm run build`, run in parallel: one short job for lint, typecheck and
# build, and the test suite split across shards. The `ci` job at the end is the one stable check name to require
# in branch protection; it passes only when every other job passed, whatever the shard count.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runners stay on ubuntu-latest through its move to Ubuntu 26 (from 2026-10-19), deliberately unpinned: Node comes
# from setup-node (.nvmrc), nothing is compiled natively and no OS package is installed here.
jobs:
  static:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: API reference freshness
        run: node scripts/api-doc.ts --check
      - name: Packed HF consumer example
        run: node scripts/pack-smoke.ts

  # Public repositories have free minutes and 4-CPU runners. Use six shards to reduce wall time; before this
  # change, three shards took 134/167/137 s in the Vitest step and about 195 s for the workflow run.
  # Keep Vitest's default worker count. File-based sharding is uneven; re-check the slowest shard as tests grow.
  test:
    name: test (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          run_install: false
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Runner
        run: echo "$(nproc) CPUs, Node $(node --version)"
      - run: npx vitest run --shard=${{ matrix.shard }}/6

  ci:
    name: ci
    if: always()
    needs: [static, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

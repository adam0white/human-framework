name: Bench

# Timing is informational on CI and never a required check. The budgets in *.timing.ts were set on a quiet Apple
# Silicon dev machine; shared GitHub runners are slower and noisy, so the budgets run at 3x (BENCH_SCALE) and a miss
# marks the step failed without failing the job. The hyperfine table in the job summary is the number to compare
# across runs. A crash or a broken bench script still fails the job. Changes that touch only prose skip the bench.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'research/**', 'archive/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'research/**', 'archive/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HYPERFINE_VERSION: 1.21.0
  # sha256 of hyperfine-v1.21.0-x86_64-unknown-linux-musl.tar.gz, from the release's asset digest. The static musl
  # build does not depend on the runner image's libc or apt sources, so the Ubuntu 26 move cannot break it.
  HYPERFINE_SHA256: 2c64127c1a0fc3bc58e365060b4d8a09e4632082e4dea843b8e4afb6a7b09f36

jobs:
  budgets:
    name: bench budgets (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Timing budgets (npm run bench, BENCH_SCALE=3)
        continue-on-error: true
        env:
          BENCH_SCALE: '3'
        run: |
          set -o pipefail
          npm run bench 2>&1 | tee "$RUNNER_TEMP/bench.log"
      - name: Bench measurements to summary
        if: always()
        run: |
          {
            echo '### npm run bench (budgets x3)'
            echo
            echo "Runner: $(nproc) CPUs, Node $(node --version)."
            echo
            echo '```'
            grep -E '[0-9] (ms|us per call)$' "$RUNNER_TEMP/bench.log" || echo 'no measurements (see the step log)'
            grep -E 'Tests ' "$RUNNER_TEMP/bench.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  hyperfine:
    name: bench hyperfine (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install hyperfine (pinned release, checksum verified)
        run: |
          name="hyperfine-v${HYPERFINE_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/hf.tar.gz" \
            "https://github.com/sharkdp/hyperfine/releases/download/v${HYPERFINE_VERSION}/${name}.tar.gz"
          echo "${HYPERFINE_SHA256}  $RUNNER_TEMP/hf.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/hf.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$RUNNER_TEMP/${name}/hyperfine" "$RUNNER_TEMP/bin/hyperfine"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: hyperfine, village 20 people x 30 days (headless CLI)
        run: |
          node scripts/bench-village.ts | tee "$RUNNER_TEMP/village.txt"
          npm run bench:hyperfine -- --export-markdown "$RUNNER_TEMP/hyperfine.md"
          {
            echo '### hyperfine: node scripts/bench-village.ts'
            echo
            echo "Runner: $(nproc) CPUs, Node $(node --version), hyperfine $(hyperfine --version | cut -d' ' -f2). Includes Node start-up and type stripping."
            echo
            cat "$RUNNER_TEMP/hyperfine.md"
            echo
            echo "One run: $(cat "$RUNNER_TEMP/village.txt")"
          } >> "$GITHUB_STEP_SUMMARY"

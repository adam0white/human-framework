name: CodeQL

# Code scanning is free on public repositories; on a private one it needs GitHub Advanced Security and the upload
# fails. The job therefore runs only while the repository is public and is skipped (not failed) while it is private.
# A scheduled event carries no repository visibility to gate on (`github.event.repository` is absent, and
# `null == false` is true in expressions), so the weekly run is gated separately on the repository variable
# CODEQL_SCHEDULE, which scripts/after-public.sh sets to `true` once the repository is public. Do not also enable
# CodeQL "default setup" in the repository settings: GitHub rejects uploads from an advanced-setup workflow like
# this one while default setup is on. Use one or the other.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1' # Mondays 07:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    if: ${{ (github.event_name == 'schedule' && vars.CODEQL_SCHEDULE == 'true') || (github.event_name != 'schedule' && github.event.repository.private == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - archive
              - '**/dist'
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
